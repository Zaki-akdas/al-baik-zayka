name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Deploy to Vercel (production)
        if: github.event_name == 'push' && env.VERCEL_TOKEN != ''
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (preview)
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != ''
        run: npx vercel deploy --yes --token="$VERCEL_TOKEN"

      - name: Skip deploy (no token)
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::Vercel deploy skipped — add VERCEL_TOKEN secret."
