name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-convex:
    name: Deploy Convex functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Deployment keys from the Convex dashboard (Settings → Keys). Mapped to
      # job env vars because secrets can't be referenced in `if:` conditions.
      # Production deploys on pushes to main; preview deploys on pull requests.
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Deploy to Convex production
        if: github.event_name == 'push' && env.CONVEX_DEPLOY_KEY != ''
        run: npx convex deploy --message "Production deploy of ${{ github.sha }}"

      - name: Deploy to Convex preview (pull request)
        if: github.event_name == 'pull_request' && env.CONVEX_PREVIEW_DEPLOY_KEY != ''
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          npx convex deploy \
            --preview-name "${{ github.head_ref }}" \
            --preview-run products:ensureSeeded \
            --message "Preview deploy of ${{ github.sha }}"

      - name: Skip Convex deploys (no deploy key secrets)
        if: >
          (github.event_name == 'push' && env.CONVEX_DEPLOY_KEY == '') ||
          (github.event_name == 'pull_request' && env.CONVEX_PREVIEW_DEPLOY_KEY == '')
        run: |
          echo "::notice::Convex deploy skipped — add CONVEX_DEPLOY_KEY (production) and CONVEX_PREVIEW_DEPLOY_KEY (preview) repository secrets to enable it."

  build-site:
    name: Build production site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error

  deploy-site:
    name: Deploy site to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-site
    if: github.event_name == 'push'
    env:
      # Netlify credentials from the Netlify dashboard (Settings → Sites → your site
      # → Site details → Access tokens). Mapped to job env vars because secrets
      # can't be referenced in `if:` conditions.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Deploy to Netlify (production)
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx netlify-cli deploy --prod --dir=dist --message "Deploy of ${{ github.sha }}"

      - name: Skip Netlify deploy (no secrets)
        if: env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == ''
        run: |
          echo "::notice::Netlify deploy skipped — add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets to enable it."
